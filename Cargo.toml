[package]
name = "unfuck"
version = "0.6.0"
edition = "2024"
description = "Python 2.7 bytecode deobfuscator"
license = "MIT"
repository = "https://github.com/landaire/unfuck"
readme = "README.md"
exclude = ['img/']

[[bin]]
name = "unfuck"
path = "src/bin.rs"
required-features = ["cli"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
structopt = { version = "0.3", optional = true }
memmap = { version = "0.7", optional = true }
py27-marshal = { version = "0.6" }
anyhow = { version = "1.0", optional = true }
thiserror = "1.0"
flate2 = "1.0"
pydis = "0.6"
num-bigint = "0.4"
num-integer = "0.1"
log = "0.4"
simple_logger = { version = "2.3", optional = true }
num-traits = "0.2"
petgraph = "0.6"
bitflags = "1.0"
csv = { version = "1.1", optional = true }
serde = { version = "1", features = ["derive"] }
stfu8 = "0.2"
rayon = { version = "1.5", optional = true }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"

[dev-dependencies]
py27-marshal = { version = "0.6" }
num-bigint = "0.4"
num-complex = "0.4"
pydis = "0.6"
insta = "1"
serde_json = "1"
simple_logger = "2.3"

[features]
default = ["cli"]
cli = ["dep:structopt", "dep:memmap", "dep:anyhow", "dep:simple_logger", "dep:csv", "dep:rayon"]
reduced_functionality = []

[patch.crates-io]
#py27-marshal = { path = "../py-marshal" }
pydis = { path = "../pydis" }
